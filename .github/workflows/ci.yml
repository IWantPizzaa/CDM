name: Plugin CI

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - "external/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/ctest/**"
      - "*" # temporary as majority of src code is still under repo_root/
  pull_request:
    paths:
      - "external/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/ctest/**"
      - "*" # temporary as majority of src code is still under repo_root/

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run clang-format style check
        uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674
        with:
          clang-format-version: "18"
          check-path: "src"
          fallback-style: "Google"

  build:
    needs: format-check
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure CMake
        env:
          # Never expose the production credential to pull-request code.
          CDM_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CDM_API_KEY || '' }}
          CDM_REQUIRE_API_KEY: ${{ github.event_name != 'pull_request' && 'ON' || 'OFF' }}
        run: >-
          cmake --preset vcpkg
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCDM_REQUIRE_API_KEY="$env:CDM_REQUIRE_API_KEY"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run configuration tests
        uses: ./.github/actions/ctest
        with:
          label: unit

      - name: Upload plugin
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: CDM-Release
          # Do not upload Secrets.h, CMakeCache.txt, objects, or debug symbols.
          path: build/Release/CDM.dll
          if-no-files-found: "error"
